[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maki-framework"
version = "0.5.0"
authors = [
  {name="Bowl of Data", email="bowlofdata@gmail.com"},
]
description = "A Python framework for multi-agent LLM interactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# The floors are the oldest releases with no published security advisory (checked with pip-audit; the test suite
# passes on exactly these versions). urllib3 is imported directly by the connector's connect-time IP pinning.
dependencies = [
    "requests>=2.33.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
]
structured = [
    "pydantic>=2.0",
]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.21",
    "black>=21.0",
    "flake8>=3.8",
    "pytest-cov>=4.0",
    "pip-audit>=2.7",
    "mypy>=1.8",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.20",
]
openrouter = [
    "openai>=1.0",
]
llamacpp = [
    "openai>=1.0",
]
vllm = [
    "openai>=1.0",
]
distributed = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
]
distributed-redis = [
    "redis>=4.5",
]
gui = [
    "PySide6>=6.7.0",
]
ftp = [
    "paramiko>=2.11.0",
]
web = [
    "feedparser>=6.0",
    "readability-lxml>=0.8",
    "html2text>=2020.1.16",
]
trends = [
    "pytrends>=4.9.0",
]
alpaca = [
    "alpaca-py>=0.43.0",
    "feedparser>=6.0",
    "yfinance>=0.2.40",
]
all = [
    "maki-framework[openai,anthropic,openrouter,llamacpp,vllm,structured,distributed,distributed-redis,gui,ftp,web,trends,alpaca]",
]

[project.urls]
Homepage = "https://bowlofdata.github.io/maki/"
Documentation = "https://bowlofdata.github.io/maki/docs/"
Source = "https://github.com/BowlOfData/maki"
Issues = "https://github.com/BowlOfData/maki/issues"
Changelog = "https://github.com/BowlOfData/maki/blob/main/CHANGELOG.md"

[project.scripts]
maki = "maki.__main__:main"
maki-gui = "maki_gui.app:run"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["maki*", "maki_gui*"]
# the test suite and dev tools (maki/test) stay in the source tree and the sdist, not in the wheel
exclude = ["maki.test*"]

[tool.setuptools.package-data]
"maki" = ["py.typed"]
"maki_gui" = ["ui/qml/*.qml"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "network: marks tests that require real external network access (deselect with '-m not network')",
]
addopts = ["-m", "not network"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
# The shipped library is type-checked; the test suite and dev tools (not in the wheel) are not.
exclude = ['^maki/test/', '(^|/)test_[^/]*\.py$']
